# 0.0.41: JEI is required on clients (a dedicated server does not need it): the Field Guide and the upgrade tooltips send players to JEI
# for every Create recipe of the mod's parts.
[[dependencies.arsenal_beacon]]
modId="jei"
mandatory=true
versionRange="[15,)"
ordering="AFTER"
side="CLIENT"

# 0.0.41: also required. KubeJS Create runs the pack scripts' Create recipes (every factory part: plating, logistics modules, resonance
# coils, restoration matrices, receivers); LesRaisins Tactical Equipments supplies the medkits and grenades every won raid pays
# (RaidRewards fails without them). The owner's pack (Create Arsenal 0.22.1) has both. (TaCZ JS is not needed: TaCZ's own KubeJS plugin
# lets the gun script work, as a dedicated server without TaCZ JS showed.)
[[dependencies.arsenal_beacon]]
modId="kubejs_create"
mandatory=true
versionRange="[2001,)"
ordering="AFTER"
side="BOTH"

