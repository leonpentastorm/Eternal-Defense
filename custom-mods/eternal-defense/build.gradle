buildscript {
    repositories { mavenCentral(); maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'
version = '1.1.14'
group = 'dev.eternaldefense'
base { archivesName = 'eternal-defense' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// The Create compat (mechanical arms and the Logistics Center Hub).
sourceSets {
    create { java { srcDirs = ['src/create/java'] }; resources { srcDirs = [] } }
    gametest { java { srcDirs = ['src/gametest/java'] }; resources { srcDirs = ['src/gametest/resources'] } }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('gametest-run')
            property 'forge.enabledGameTestNamespaces', 'eternal_defense'
            mods { eternal_defense { source sourceSets.main; source sourceSets.create; source sourceSets.gametest } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { eternal_defense { source sourceSets.main; source sourceSets.create; source sourceSets.gametest } }
        }
    }
}
repositories {
    mavenCentral(); maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/'; content { includeGroup 'org.spongepowered' } }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.createmod.net'; content { includeGroup 'com.simibubi.create'; includeGroup 'net.createmod.ponder' } }
}
dependencies {
    implementation project(":eternal-defense-displays")
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    // Pinned official artifacts, development/runtime only; neither addon is shaded into the jars.
    implementation fg.deobf('curse.maven:timeless-and-classics-zero-1028108:9037989')
    implementation fg.deobf('curse.maven:tacz-attributes-1113285:8470731')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.62.0.217')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.62.0.217')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    // Compile only, for the Create compat source set; never shaded
    createCompileOnly(fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')){ transitive = false }
    createCompileOnly('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91'){ transitive = false }   // Create's block entities implement a Ponder interface (a type name only: not remapped)
}
sourceSets.create.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gametest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
mixin {
    add sourceSets.main, 'eternal_defense.refmap.json'
    config 'eternal_defense.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar).configure { from sourceSets.create.output; finalizedBy 'reobfJar' }

tasks.named('jar', Jar).configure { manifest { attributes('MixinConfigs': 'eternal_defense.mixins.json') } }

// The release jar's name mapping (official -> SRG) must see Create's classes too.
reobf { jar { libraries.from(sourceSets.create.compileClasspath) } }

// No-voice edition: the release jar with every spoken line replaced by a game sound
def soundsFile = file('src/main/resources/assets/eternal_defense/sounds.json')
def voiceMapFile = file('src/novoice/voice-replacements.json')
def voiceFiles = {
    def sounds = new groovy.json.JsonSlurper().parse(soundsFile)
    new groovy.json.JsonSlurper().parse(voiceMapFile).keySet().collectMany { event ->
        sounds[event].sounds.collect { s -> def n = (s instanceof Map ? s.name : s).split(':'); "assets/${n[0]}/sounds/${n[1]}.ogg".toString() }
    }
}
def noVoiceSounds = tasks.register('noVoiceSounds') {
    inputs.files soundsFile, voiceMapFile
    def out = layout.buildDirectory.file('novoice/assets/eternal_defense/sounds.json')
    outputs.file out
    doLast {
        def sounds = new groovy.json.JsonSlurper().parse(soundsFile)
        new groovy.json.JsonSlurper().parse(voiceMapFile).each { event, game ->
            if (!sounds.containsKey(event)) throw new GradleException("No sound event ${event}")
            def entry = [name: game.name, type: 'event']
            if (game.pitch) entry.pitch = game.pitch
            sounds[event].sounds = [entry]
        }
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sounds))
    }
}
tasks.register('noVoiceJar', Zip) {
    group = 'build'
    dependsOn 'reobfJar', noVoiceSounds
    archiveFileName = "eternal-defense-${version}-novoice.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile })) {
        exclude 'assets/eternal_defense/sounds.json'
        exclude voiceFiles()
        filesMatching('META-INF/mods.toml') { filter { line -> line.startsWith("description='''") ? line.replace("description='''", "description='''No-voice edition: radio lines use game sounds. ") : line } }
    }
    from(layout.buildDirectory.dir('novoice'))
}
