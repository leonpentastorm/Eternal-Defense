plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
version = '1.1.0'
group = 'dev.createarsenal'
base { archivesName = 'arsenal-displays' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.20' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
