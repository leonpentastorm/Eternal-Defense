pluginManagement {
    repositories { gradlePluginPortal(); maven { url = 'https://maven.minecraftforge.net/' } }
}
rootProject.name = 'eternal-defense'
include ':eternal-defense', ':eternal-defense-gun-guide', ':eternal-defense-displays'
project(':eternal-defense').projectDir = file('custom-mods/eternal-defense')
project(':eternal-defense-gun-guide').projectDir = file('custom-mods/eternal-defense-gun-guide')
project(':eternal-defense-displays').projectDir = file('custom-mods/eternal-defense-displays')
