plugins { id 'base' }
tasks.named('build') {
    dependsOn ':eternal-defense:build', ':eternal-defense-gun-guide:build', ':eternal-defense-displays:build'
}
tasks.register('releaseJars') {
    group = 'build'
    description = 'Build the release JARs: the three mods, and the no-voice edition of Eternal Defense.'
    dependsOn 'build', ':eternal-defense:noVoiceJar'
}
